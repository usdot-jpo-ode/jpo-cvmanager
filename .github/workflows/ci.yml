name: cv-manager

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - cdot-release*
  pull_request:
    branches:
      - "**" # Run on PRs to any branch
    types: [opened, reopened, synchronize]

jobs:
  test_change_limit:
    if: vars.MAX_CHANGED_FILES && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: step-security/changed-files@v46

      - name: Check for large changes
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          # Check the number of changed files in the pull request
          CHANGED_FILES_COUNT=$(echo "$ALL_CHANGED_FILES" | wc -w)

          echo "Max allowed changed files: ${{ vars.MAX_CHANGED_FILES }}, Changed files in PR: $CHANGED_FILES_COUNT"

          if [ "$CHANGED_FILES_COUNT" -gt "${{ vars.MAX_CHANGED_FILES }}" ]; then
            echo "Error: Pull request has more than ${{ vars.MAX_CHANGED_FILES }} changed files. Please reduce the size of your changes."
            exit 1
          else
            echo "Pull request size is within the acceptable limit."
          fi

  build_api:
    needs: test_change_limit
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: python:3.12.2
      options: --user root
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ISS_TEST_DATABASE_URL: postgresql+pg8000://postgres:postgres@postgres:5432/postgres
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get -y install python3-coverage python3-pip python3-pytest

      - name: Install Python Requirements
        run: python3 -m pip install -r $GITHUB_WORKSPACE/services/requirements.txt

      - name: Run Tests and Generate Coverage
        continue-on-error: false
        run: |
          # Generate coverage paths relative to Sonar's repository-root projectBaseDir
          export PYTHONPATH=$PYTHONPATH:/usr/lib/python3/dist-packages
          cd "$GITHUB_WORKSPACE"

          # Run tests and generate coverage report
          python3 -m coverage run --rcfile=services/.coveragerc -m pytest -c services/pytest.ini services
          python3 -m coverage xml --rcfile=services/.coveragerc -o services/coverage.xml --omit="/opt/*,/root/*,/tmp/*,/usr/*,/var/*,**/__init__.py"

      - name: Archive Code Coverage Results
        uses: actions/upload-artifact@v4
        with:
          name: build_api
          path: services/coverage.xml

      - name: Find coverage.xml
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE/services" -name "coverage.xml"

  webapp:
    needs: test_change_limit
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: node:24
      options: --user root
      env:
        CI: true
        TZ: America/Denver
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v4

      - name: Build Web Application
        continue-on-error: false
        run: |
          # Navigate to the webapp directory and perform necessary setup
          cd $GITHUB_WORKSPACE/webapp
          npm ci --ignore-scripts

          # Run tests with coverage and suppress failures
          npm test -- --coverage

      - name: Archive Code Coverage Results
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: webapp/coverage/*

      - name: Find lcov.info
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE" -name "lcov.info"

  build_keycloak_provider:
    needs: test_change_limit
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.9-eclipse-temurin-21
      options: --user root
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '21'
          cache: maven
          cache-dependency-path: resources/keycloak/custom-user-provider/pom.xml

      - name: Build and Test with Maven
        run: |
          cd $GITHUB_WORKSPACE/resources/keycloak/custom-user-provider
          mvn clean install

      - name: Archive Test Results
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-user-provider-test-results
          path: $GITHUB_WORKSPACE/resources/keycloak/custom-user-provider/target/surefire-reports

      - name: Archive Sonar Inputs
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-user-provider-sonar-inputs
          path: |
            resources/keycloak/custom-user-provider/target/classes
            resources/keycloak/custom-user-provider/target/test-classes
            resources/keycloak/custom-user-provider/target/site/jacoco/jacoco.xml
          if-no-files-found: error

  build_rsu_info_bridge:
    needs: test_change_limit
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-rsu-info-bridge-${{ hashFiles('**/services/rsu-info-bridge/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-rsu-info-bridge-
            ${{ runner.os }}-maven-

      - name: Build and Test with Maven
        run: |
          cd $GITHUB_WORKSPACE/services/rsu-info-bridge
          ./mvnw clean verify

      - name: Archive Test Results
        uses: actions/upload-artifact@v4
        with:
          name: rsu-info-bridge-test-results
          path: $GITHUB_WORKSPACE/services/rsu-info-bridge/target/surefire-reports

      - name: Archive Sonar Inputs
        uses: actions/upload-artifact@v4
        with:
          name: rsu-info-bridge-sonar-inputs
          path: |
            services/rsu-info-bridge/target/classes
            services/rsu-info-bridge/target/test-classes
          if-no-files-found: error

  build_intersection_api:
    needs: test_change_limit
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "22"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ hashFiles('**/settings.xml') }}-${{ runner.os }}-java-22
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ runner.os }}-java-22
            ${{ runner.os }}-maven-${{ runner.os }}-java-22
            ${{ runner.os }}-maven

      - name: Install Dependencies
        env:
          MAVEN_GITHUB_TOKEN: ${{ secrets.MAVEN_GITHUB_TOKEN }}
          MAVEN_GITHUB_ORG: ${{ github.repository_owner }}
        run: |
          cd $GITHUB_WORKSPACE/services/intersection-api/api
          mvn clean install -DskipTests -s ./settings.xml
          mvn dependency:go-offline -s ./settings.xml

      - name: Run tests
        env:
          MAVEN_GITHUB_TOKEN: ${{ secrets.MAVEN_GITHUB_TOKEN }}
          MAVEN_GITHUB_ORG: ${{ github.repository_owner }}
        run: |
          cd $GITHUB_WORKSPACE/services/intersection-api/api
          mvn verify -s ./settings.xml

      - name: Archive Test Results
        uses: actions/upload-artifact@v4
        with:
          name: intersection-api-test-results
          path: $GITHUB_WORKSPACE/services/intersection-api/api/target/surefire-reports

      - name: Archive Sonar Inputs
        uses: actions/upload-artifact@v4
        with:
          name: intersection-api-sonar-inputs
          path: |
            services/intersection-api/api/target/classes
            services/intersection-api/api/target/test-classes
            services/intersection-api/api/target/site/jacoco/jacoco.xml
          if-no-files-found: error

      - name: Clean up
        run: |
          rm -rf $GITHUB_WORKSPACE/services/intersection-api/api/target

  build_rsu_status_monitor:
    needs: test_change_limit
    if: ${{ always() && !failure() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    container:
      image: maven:3.9.9-eclipse-temurin-22
      options: --user root
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ hashFiles('**/settings.xml') }}-${{ runner.os }}-java-22
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ runner.os }}-java-22
            ${{ runner.os }}-maven-${{ runner.os }}-java-22
            ${{ runner.os }}-maven

      - name: Install Dependencies
        env:
          MAVEN_GITHUB_TOKEN: ${{ secrets.MAVEN_GITHUB_TOKEN }}
          MAVEN_GITHUB_ORG: ${{ github.repository_owner }}
        run: |
          cd $GITHUB_WORKSPACE/services/rsu-status-monitor/rsu-status-monitor
          mvn clean install -DskipTests -s ./settings.xml
          mvn dependency:go-offline -s ./settings.xml

      - name: Run tests
        env:
          MAVEN_GITHUB_TOKEN: ${{ secrets.MAVEN_GITHUB_TOKEN }}
          MAVEN_GITHUB_ORG: ${{ github.repository_owner }}
        run: |
          cd $GITHUB_WORKSPACE/services/rsu-status-monitor/rsu-status-monitor
          mvn verify -s ./settings.xml

      - name: Archive Test Results
        uses: actions/upload-artifact@v4
        with:
          name: rsu-status-monitor-test-results
          path: $GITHUB_WORKSPACE/services/rsu-status-monitor/rsu-status-monitor/target/surefire-reports

      - name: Archive Sonar Inputs
        uses: actions/upload-artifact@v4
        with:
          name: rsu-status-monitor-sonar-inputs
          path: |
            services/rsu-status-monitor/rsu-status-monitor/target/classes
            services/rsu-status-monitor/rsu-status-monitor/target/test-classes
            services/rsu-status-monitor/rsu-status-monitor/target/site/jacoco/jacoco.xml
          if-no-files-found: error

      - name: Clean up
        run: |
          rm -rf $GITHUB_WORKSPACE/services/rsu-status-monitor/rsu-status-monitor/target

  build_flyway_image:
    needs: [test_change_limit, validate_migrations]
    if: ${{ !cancelled() && needs.validate_migrations.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cvmanager-flyway
          tags: |
            type=sha
            type=ref,event=branch

      - name: Build and push Flyway image
        uses: docker/build-push-action@v6
        with:
          context: resources/db/
          file: resources/db/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  validate_migrations:
    needs: test_change_limit
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v4

      - name: Run Flyway migrations
        run: |
          docker run --rm \
            --network host \
            -v "$GITHUB_WORKSPACE/resources/db/migration:/flyway/sql" \
            -v "$GITHUB_WORKSPACE/resources/db/flyway.toml:/flyway/conf/flyway.toml" \
            flyway/flyway:10-alpine \
            -url=jdbc:postgresql://localhost:5432/postgres \
            -user=postgres \
            -password=postgres \
            migrate

      - name: Verify migration state
        run: |
          docker run --rm \
            --network host \
            -v "$GITHUB_WORKSPACE/resources/db/migration:/flyway/sql" \
            -v "$GITHUB_WORKSPACE/resources/db/flyway.toml:/flyway/conf/flyway.toml" \
            flyway/flyway:10-alpine \
            -url=jdbc:postgresql://localhost:5432/postgres \
            -user=postgres \
            -password=postgres \
            info

  sonar:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [build_api, webapp, build_keycloak_provider, build_rsu_info_bridge, build_intersection_api, build_rsu_status_monitor]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download code coverage results
        uses: actions/download-artifact@v4
        continue-on-error: false
        with:
          name: build_api
          path: services

      - name: Download Code Coverage Results
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: webapp

      - name: Download Keycloak Sonar Inputs
        uses: actions/download-artifact@v4
        with:
          name: keycloak-user-provider-sonar-inputs
          path: resources/keycloak/custom-user-provider/target

      - name: Download RSU Info Bridge Sonar Inputs
        uses: actions/download-artifact@v4
        with:
          name: rsu-info-bridge-sonar-inputs
          path: services/rsu-info-bridge/target

      - name: Download Intersection API Sonar Inputs
        uses: actions/download-artifact@v4
        with:
          name: intersection-api-sonar-inputs
          path: services/intersection-api/api/target

      - name: Download RSU Status Monitor Sonar Inputs
        uses: actions/download-artifact@v4
        with:
          name: rsu-status-monitor-sonar-inputs
          path: services/rsu-status-monitor/rsu-status-monitor/target

      - name: Find coverage.xml
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE" -name "coverage.xml"

      - name: Find lcov.info
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE" -name "lcov.info"

      - name: Validate Coverage Reports
        shell: bash
        run: |
          reports=(
            "services/coverage.xml"
            "webapp/lcov.info"
            "resources/keycloak/custom-user-provider/target/site/jacoco/jacoco.xml"
            "services/intersection-api/api/target/site/jacoco/jacoco.xml"
            "services/rsu-status-monitor/rsu-status-monitor/target/site/jacoco/jacoco.xml"
          )
          for report in "${reports[@]}"; do
            if [ ! -s "$report" ]; then
              echo "::error::Missing or empty coverage report: $report"
              exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Sonar Properties File
        run: |
          cat <<EOF > sonar-project.properties
          sonar.host.url=https://sonarcloud.io
          sonar.exclusions=**/__init__.py,**/*test*.py,**/test/**,**/tests/**,webapp/src/**/*.test.ts,webapp/src/**/*.test.tsx,webapp/src/setupTests.ts,webapp/src/**/test-utils.tsx
          sonar.cpd.exclusions=services/intersection-api/api/src/test/resources/snapshots/**,services/intersection-api/api/src/main/resources/templates/**,services/intersection-api/docs/**,resources/deprecated/**
          # Match JaCoCo's Java model exclusions and omit Lombok-only configuration holders.
          sonar.coverage.exclusions=**/__init__.py,**/*test*.py,**/test/**,services/intersection-api/api/src/main/java/**/models/**,services/intersection-api/api/src/main/java/**/GcpObjectStorageProperties.java,services/intersection-api/api/src/main/java/**/ObjectStorageProperties.java,services/intersection-api/api/src/main/java/**/FirmwareUploadCleanupProperties.java,services/intersection-api/api/src/main/java/**/RsuRebootProperties.java
          sonar.javascript.lcov.reportPaths=webapp/lcov.info
          sonar.sources=services/addons/images/count_metric,services/addons/images/firmware_manager,services/addons/images/iss_health_check,services/addons/images/obu_ota_server,services/addons/images/rsu_status_check,services/api/src,services/common,webapp/src,resources/keycloak/custom-user-provider/src/main/java,services/rsu-info-bridge/src/main/java,services/intersection-api/api/src/main/java,services/rsu-status-monitor/rsu-status-monitor/src/main/java
          sonar.tests=services/addons/tests,services/api/tests,services/common/tests,webapp/src,resources/keycloak/custom-user-provider/src/test/java,services/rsu-info-bridge/src/test/java,services/intersection-api/api/src/test/java,services/rsu-status-monitor/rsu-status-monitor/src/test/java
          sonar.test.inclusions=services/addons/tests/**,services/api/tests/**,services/common/tests/**,webapp/src/**/*.test.ts,webapp/src/**/*.test.tsx,webapp/src/setupTests.ts,webapp/src/**/test-utils.tsx,resources/keycloak/custom-user-provider/src/test/java/**,services/rsu-info-bridge/src/test/java/**,services/intersection-api/api/src/test/java/**,services/rsu-status-monitor/rsu-status-monitor/src/test/java/**
          sonar.organization=${{ vars.SONAR_ORGANIZATION || github.repository_owner }}
          sonar.projectBaseDir=$GITHUB_WORKSPACE
          sonar.projectKey=${{ github.repository_owner }}_jpo-cvmanager
          sonar.projectName=jpo-cvmanager
          sonar.python.coverage.reportPaths=services/coverage.xml
          sonar.python.version=3.12.2
          sonar.java.binaries=resources/keycloak/custom-user-provider/target/classes,services/rsu-info-bridge/target/classes,services/intersection-api/api/target/classes,services/rsu-status-monitor/rsu-status-monitor/target/classes
          sonar.java.test.binaries=resources/keycloak/custom-user-provider/target/test-classes,services/rsu-info-bridge/target/test-classes,services/intersection-api/api/target/test-classes,services/rsu-status-monitor/rsu-status-monitor/target/test-classes
          sonar.coverage.jacoco.xmlReportPaths=resources/keycloak/custom-user-provider/target/site/jacoco/jacoco.xml,services/intersection-api/api/target/site/jacoco/jacoco.xml,services/rsu-status-monitor/rsu-status-monitor/target/site/jacoco/jacoco.xml
          EOF

      - name: Run SonarScanner
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
