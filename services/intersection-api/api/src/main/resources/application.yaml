# application configuration
server:
  port: 8089
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
  error:
    include-stacktrace: never

### keycloak configuration
keycloak:
  realm: cvmanager
  auth-server-url: ${AUTH_SERVER_URL:http://cvmanager_keycloak:8084}
  client-id: ${KEYCLOAK_CLIENT_API_ID:cvmanager-api}
  client-secret: ${KEYCLOAK_CLIENT_API_SECRET:keycloak-secret-key}

spring.security.oauth2.resourceserver.jwt:
  issuer-uri: ${AUTH_SERVER_URL:http://cvmanager_keycloak:8084}/realms/cvmanager
  jwk-set-uri: ${AUTH_SERVER_URL:http://cvmanager_keycloak:8084}/realms/cvmanager/protocol/openid-connect/certs

spring.kafka.bootstrap-servers: ${KAFKA_BROKER_IP:kafka}:${KAFKA_BROKER_PORT:9092}
logging.level.org.apache.kafka: INFO
logging.level: INFO

schema.bsm: classpath:schemas/bsm.schema.json
schema.map: classpath:schemas/map.schema.json
schema.spat: classpath:schemas/spat.schema.json
schema.psm: classpath:schemas/psm.schema.json
schema.rtcm: classpath:schemas/rtcm.schema.json

# Amount of time to wait to try and increase batching
kafka.linger_ms: 50

kafka.topics:
  autoCreateTopics: false
  numPartitions: 1
  numReplicas: 1
  createTopics:
    - name: topic.ProcessedSpat
      cleanupPolicy: delete
      retentionMs: 300000
    - name: topic.ProcessedMap
      cleanupPolicy: delete
      retentionMs: 300000

conflict:
  monitor:
    api:
      kafka-consumers-always-on: false

# MongoDB Configuration
spring:
  data:
    mongodb:
      database: ${CM_DATABASE_NAME:CV}
      host: ${DB_HOST_IP:mongo}
      port: 27017
      username: ${MONGO_READ_WRITE_USER:ode}
      password: ${MONGO_READ_WRITE_PASS:replace_me}
      authenticationDatabase: ${CM_MONGO_AUTH_DB:admin}
      uri: ${CM_MONGO_URI:null}
  # Postgres Configuration
  datasource:
    url: ${POSTGRES_SERVER_URL:jdbc:postgresql://cvmanager_postgres:5432}/postgres
    username: ${PG_DB_USER:postgres}
    password: ${PG_DB_PASS}
  jpa:
    database: postgresql
  ### Spring Mail Settings (If using emailBroker SMTP)
  mail:
    host: ${INTERSECTION_SMTP_SERVER_HOST:localhost}
    port: ${INTERSECTION_SMTP_SERVER_PORT:25}
    username: ${INTERSECTION_SMTP_USERNAME:}
    password: ${INTERSECTION_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          ssl:
            trust: ${INTERSECTION_SMTP_SERVER_HOST:localhost}
          auth: ${INTERSECTION_SMTP_AUTH:false}
          starttls:
            enable: ${INTERSECTION_SMTP_STARTTLS:false}
            required: ${INTERSECTION_SMTP_STARTTLS:false}

enable:
  api: ${INTERSECTION_API_ENABLE_API:true}
  email: ${INTERSECTION_API_ENABLE_EMAILER:true}
  report: ${INTERSECTION_API_ENABLE_REPORTS:true}
  haas: ${INTERSECTION_API_ENABLE_HAAS:true}
  asn1-decoder: ${INTERSECTION_API_ENABLE_ASN1_DECODER:true}

cmServerURL: ${CM_SERVER_URL:http://conflictmonitor:8082}
mongoTimeoutMs: ${CM_MONGO_TIMEOUT_MS:5000}
cors: '*'
maximumResponseSize: ${CM_MAXIMUM_RESPONSE_SIZE:10000}

spring.main.allow-circular-references: true
spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
server.servlet.context-path: ${BASE_ROUTE_PREFIX:/}

### General Email Settings
email:
  # Email Broker Options: sendgrid, postmark, anything else will use generic SMTP mail server.
  broker: ${INTERSECTION_EMAIL_BROKER:SMTP}
  sender-address: ${INTERSECTION_SENDER_EMAIL:donotreply@cvmanager.com}
  unsubscribe-secret-key: ${UNSUBSCRIBE_SECRET_KEY}
  cvmgr-front-end-uri: ${CV_MANAGER_FRONT_END_URI:http://localhost:3000}

  sendgrid:
    api-key: ${SENDGRID_API_KEY:}
  postmark:
    api-key: ${POSTMARK_API_KEY:}

j2735.api:
  text-buffer-size: ${J2735_ASN_TEXT_BUFFER_SIZE:262144}
  uper-buffer-size: ${J2735_UPER_BUFFER_SIZE:8192}
  error-buffer-size: ${J2735_ERROR_BUFFER_SIZE:256}

firmwareManagerEndpoint: ${FIRMWARE_MANAGER_ENDPOINT:}
